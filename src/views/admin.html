<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Admin Dashboard | Digital NFC Cards</title>
  <style>
    :root {
      --bg: #090d16;
      --card-bg: #131b2e;
      --card-border: rgba(255, 255, 255, 0.08);
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      --accent: #3b82f6;
      --accent-hover: #2563eb;
      --danger: #ef4444;
      --success: #10b981;
      --input-bg: rgba(255, 255, 255, 0.05);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body { background: var(--bg); color: var(--text-main); min-height: 100vh; display: flex; flex-direction: column; }

    /* Top Nav */
    header {
      background: rgba(19, 27, 46, 0.8);
      border-bottom: 1px solid var(--card-border);
      backdrop-filter: blur(12px);
      padding: 16px 24px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      position: sticky;
      top: 0;
      z-index: 50;
    }
    .brand { font-size: 1.25rem; font-weight: 700; display: flex; align-items: center; gap: 8px; }
    .brand span { color: var(--accent); }
    .header-actions { display: flex; align-items: center; gap: 12px; }

    /* Buttons */
    .btn {
      padding: 8px 16px;
      border-radius: 10px;
      font-size: 0.9rem;
      font-weight: 600;
      cursor: pointer;
      border: none;
      transition: all 0.15s ease;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      text-decoration: none;
    }
    .btn-primary { background: var(--accent); color: #fff; }
    .btn-primary:hover { background: var(--accent-hover); }
    .btn-secondary { background: rgba(255, 255, 255, 0.08); color: var(--text-main); border: 1px solid var(--card-border); }
    .btn-secondary:hover { background: rgba(255, 255, 255, 0.14); }
    .btn-danger { background: rgba(239, 68, 68, 0.15); color: #f87171; border: 1px solid rgba(239, 68, 68, 0.3); }
    .btn-danger:hover { background: rgba(239, 68, 68, 0.25); }
    .btn-sm { padding: 6px 10px; font-size: 0.8rem; border-radius: 8px; }

    /* Main Container */
    main { max-width: 1200px; width: 100%; margin: 0 auto; padding: 24px 20px; flex: 1; }

    /* Tab Controls */
    .nav-tabs { display: flex; gap: 12px; margin-bottom: 24px; border-bottom: 1px solid var(--card-border); padding-bottom: 12px; }
    .tab-btn {
      background: none; border: none; color: var(--text-muted); font-size: 1rem; font-weight: 600; cursor: pointer; padding: 8px 16px; border-radius: 8px; transition: color 0.15s;
    }
    .tab-btn.active { color: #fff; background: rgba(59, 130, 246, 0.15); color: #60a5fa; }

    /* Table & Cards */
    .panel { background: var(--card-bg); border: 1px solid var(--card-border); border-radius: 16px; overflow: hidden; }
    .panel-header { padding: 18px 20px; border-bottom: 1px solid var(--card-border); display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 12px; }
    .panel-header h2 { font-size: 1.15rem; font-weight: 700; }

    .search-input {
      background: var(--input-bg); border: 1px solid var(--card-border); border-radius: 10px; padding: 8px 14px; color: #fff; font-size: 0.9rem; outline: none; width: 240px;
    }

    table { width: 100%; border-collapse: collapse; text-align: left; }
    th { padding: 14px 18px; font-size: 0.8rem; text-transform: uppercase; color: var(--text-muted); border-bottom: 1px solid var(--card-border); }
    td { padding: 14px 18px; font-size: 0.9rem; border-bottom: 1px solid var(--card-border); vertical-align: middle; }
    tr:last-child td { border-bottom: none; }
    tr:hover td { background: rgba(255, 255, 255, 0.02); }

    .staff-cell { display: flex; align-items: center; gap: 12px; }
    .table-avatar { width: 44px; height: 44px; border-radius: 50%; object-fit: cover; background: #1e293b; border: 2px solid rgba(59, 130, 246, 0.4); flex-shrink: 0; }
    .table-initials { width: 44px; height: 44px; border-radius: 50%; background: #1e293b; display: flex; align-items: center; justify-content: center; font-weight: 700; font-size: 0.95rem; color: #93c5fd; border: 2px solid rgba(59, 130, 246, 0.4); flex-shrink: 0; }
    .staff-info h4 { font-size: 0.95rem; font-weight: 600; }
    .staff-info p { font-size: 0.8rem; color: var(--text-muted); }

    .badge { display: inline-block; padding: 3px 8px; border-radius: 6px; font-size: 0.75rem; font-weight: 600; }
    .badge-active { background: rgba(16, 185, 129, 0.15); color: #34d399; }
    .badge-inactive { background: rgba(239, 68, 68, 0.15); color: #f87171; }

    .action-group { display: flex; gap: 6px; flex-wrap: wrap; }

    /* Login Screen */
    #login-view { max-width: 380px; width: 100%; margin: 80px auto; background: var(--card-bg); border: 1px solid var(--card-border); border-radius: 20px; padding: 32px 24px; text-align: center; }
    #login-view h2 { margin-bottom: 8px; }
    #login-view p { color: var(--text-muted); font-size: 0.9rem; margin-bottom: 24px; }

    /* Modal */
    .modal-backdrop { position: fixed; inset: 0; background: rgba(0,0,0,0.75); backdrop-filter: blur(4px); display: none; align-items: center; justify-content: center; z-index: 100; padding: 16px; }
    .modal-box { background: var(--card-bg); border: 1px solid var(--card-border); border-radius: 20px; width: 100%; max-width: 580px; max-height: 90vh; overflow-y: auto; padding: 24px; }
    .modal-title-row { display: flex; justify-content: space-between; align-items: center; margin-bottom: 18px; }
    
    .form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; margin-bottom: 18px; }
    .form-col-full { grid-column: span 2; }
    .form-group label { display: block; font-size: 0.8rem; color: var(--text-muted); margin-bottom: 6px; }
    .form-group input, .form-group textarea, .form-group select {
      width: 100%; background: var(--input-bg); border: 1px solid var(--card-border); border-radius: 10px; padding: 10px 12px; color: #fff; font-size: 0.9rem; outline: none;
    }
    .form-group input:focus, .form-group textarea:focus { border-color: var(--accent); }
    .avatar-preview-box { display: flex; align-items: center; gap: 12px; margin-top: 8px; }
    .avatar-preview-box img { width: 50px; height: 50px; border-radius: 50%; object-fit: cover; border: 2px solid var(--accent); }

    /* Toast */
    #toast { position: fixed; bottom: 24px; right: 24px; background: #2563eb; color: #fff; padding: 12px 20px; border-radius: 12px; font-weight: 600; display: none; box-shadow: 0 10px 25px rgba(0,0,0,0.5); z-index: 200; }
  </style>
</head>
<body>

  <!-- Top Header -->
  <header>
    <div class="brand">
      ⚡ <span>Nevada</span> NFC Directory
    </div>
    <div class="header-actions" id="header-user-actions" style="display: none;">
      <button class="btn btn-secondary btn-sm" onclick="logout()">Logout</button>
    </div>
  </header>

  <!-- Login View -->
  <section id="login-view">
    <h2>Admin Sign In</h2>
    <p>Sign in to manage company staff digital cards</p>
    <form onsubmit="handleLogin(event)">
      <div class="form-group" style="text-align: left; margin-bottom: 14px;">
        <label>Admin Email</label>
        <input type="email" id="login-email" value="admin@example.com" required />
      </div>
      <div class="form-group" style="text-align: left; margin-bottom: 20px;">
        <label>Password</label>
        <input type="password" id="login-password" value="admin123" required />
      </div>
      <button type="submit" class="btn btn-primary" style="width: 100%; justify-content: center; padding: 12px;">
        Sign In
      </button>
    </form>
  </section>

  <!-- Dashboard Main View -->
  <main id="dashboard-view" style="display: none;">
    
    <div class="nav-tabs">
      <button class="tab-btn active" onclick="switchTab('staff-tab', this)">Staff Directory</button>
      <button class="tab-btn" onclick="switchTab('leads-tab', this)">Captured Leads</button>
    </div>

    <!-- Staff Directory Tab -->
    <div id="staff-tab">
      <div class="panel">
        <div class="panel-header">
          <h2>All Staff Digital Cards</h2>
          <div style="display: flex; gap: 12px; align-items: center;">
            <input type="text" class="search-input" id="search-input" placeholder="Search staff..." oninput="filterStaff()" />
            <button class="btn btn-primary" onclick="openCreateModal()">+ Add Staff</button>
          </div>
        </div>

        <div style="overflow-x: auto;">
          <table>
            <thead>
              <tr>
                <th>Staff Member</th>
                <th>Slug / Link</th>
                <th>Contact</th>
                <th>Status</th>
                <th>Card Actions</th>
                <th>Edit</th>
              </tr>
            </thead>
            <tbody id="staff-table-body">
              <!-- Populated via JS -->
            </tbody>
          </table>
        </div>
      </div>
    </div>

    <!-- Leads Tab -->
    <div id="leads-tab" style="display: none;">
      <div class="panel">
        <div class="panel-header">
          <h2>Inbound Contacts (2-Way Exchange)</h2>
        </div>
        <div style="overflow-x: auto;">
          <table>
            <thead>
              <tr>
                <th>Visitor</th>
                <th>Contact Details</th>
                <th>Staff Recipient</th>
                <th>Source</th>
                <th>Note</th>
                <th>Received At</th>
              </tr>
            </thead>
            <tbody id="leads-table-body">
              <!-- Populated via JS -->
            </tbody>
          </table>
        </div>
      </div>
    </div>

  </main>

  <!-- Modal: Create / Edit Staff -->
  <div id="staff-modal" class="modal-backdrop">
    <div class="modal-box">
      <div class="modal-title-row">
        <h3 id="modal-heading">Add New Staff Member</h3>
        <button class="btn btn-secondary btn-sm" onclick="closeStaffModal()">&times;</button>
      </div>

      <form id="staff-form" onsubmit="handleStaffSubmit(event)">
        <input type="hidden" id="staff-id" />

        <div class="form-grid">
          <div class="form-group">
            <label>First Name *</label>
            <input type="text" id="form-first-name" required oninput="autoGenerateSlug()" />
          </div>
          <div class="form-group">
            <label>Last Name *</label>
            <input type="text" id="form-last-name" required oninput="autoGenerateSlug()" />
          </div>

          <div class="form-group form-col-full">
            <label>Card URL Slug * (e.g. "john-doe" ➔ /p/john-doe)</label>
            <input type="text" id="form-slug" required />
          </div>

          <!-- Optional Avatar Upload -->
          <div class="form-group form-col-full">
            <label>Profile Picture (Optional)</label>
            <input type="file" id="form-avatar" accept="image/png, image/jpeg, image/webp" onchange="previewAvatar(event)" />
            <div id="avatar-preview-row" class="avatar-preview-box" style="display: none;">
              <img id="avatar-preview-img" src="" alt="Preview" />
              <label style="margin: 0; font-size: 0.85rem; cursor: pointer;">
                <input type="checkbox" id="form-remove-avatar" /> Remove photo
              </label>
            </div>
          </div>

          <div class="form-group">
            <label>Job Title</label>
            <input type="text" id="form-job-title" placeholder="e.g. VP of Sales" />
          </div>
          <div class="form-group">
            <label>Department</label>
            <input type="text" id="form-department" placeholder="e.g. Commercial" />
          </div>

          <div class="form-group">
            <label>Company</label>
            <input type="text" id="form-company" value="Nevada Systems" />
          </div>
          <div class="form-group">
            <label>Phone Number</label>
            <input type="text" id="form-phone" placeholder="+1 555-019-2233" />
          </div>

          <div class="form-group">
            <label>Email Address</label>
            <input type="email" id="form-email" placeholder="name@company.com" />
          </div>
          <div class="form-group">
            <label>WhatsApp Number</label>
            <input type="text" id="form-whatsapp" placeholder="+15550192233" />
          </div>

          <div class="form-group">
            <label>LinkedIn URL</label>
            <input type="url" id="form-linkedin" placeholder="https://linkedin.com/in/..." />
          </div>
          <div class="form-group">
            <label>GitHub URL</label>
            <input type="url" id="form-github" placeholder="https://github.com/..." />
          </div>

          <div class="form-group form-col-full">
            <label>Website URL</label>
            <input type="url" id="form-website" placeholder="https://company.com" />
          </div>

          <div class="form-group form-col-full">
            <label>Bio / Headline</label>
            <textarea id="form-bio" rows="2" placeholder="Short intro on card..."></textarea>
          </div>

          <div class="form-group form-col-full">
            <label style="display: flex; align-items: center; gap: 8px; cursor: pointer;">
              <input type="checkbox" id="form-active" checked />
              Card Active (uncheck to temporarily deactivate)
            </label>
          </div>
        </div>

        <div style="display: flex; justify-content: flex-end; gap: 10px;">
          <button type="button" class="btn btn-secondary" onclick="closeStaffModal()">Cancel</button>
          <button type="submit" class="btn btn-primary" id="save-staff-btn">Save Staff Member</button>
        </div>
      </form>
    </div>
  </div>

  <div id="toast"></div>

  <script>
    let staffList = [];

    // Check login state on load
    document.addEventListener("DOMContentLoaded", async () => {
      try {
        const res = await fetch('/api/auth/me');
        if (res.ok) {
          showDashboard();
        } else {
          showLogin();
        }
      } catch (err) {
        showLogin();
      }
    });

    function showToast(msg) {
      const toast = document.getElementById('toast');
      toast.textContent = msg;
      toast.style.display = 'block';
      setTimeout(() => { toast.style.display = 'none'; }, 3000);
    }

    async function handleLogin(e) {
      e.preventDefault();
      const email = document.getElementById('login-email').value;
      const password = document.getElementById('login-password').value;

      try {
        const res = await fetch('/api/auth/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ email, password })
        });
        const data = await res.json();
        if (data.success) {
          showDashboard();
        } else {
          alert(data.error || 'Login failed');
        }
      } catch (err) {
        alert('Error connecting to server.');
      }
    }

    async function logout() {
      await fetch('/api/auth/logout', { method: 'POST' });
      showLogin();
    }

    function showLogin() {
      document.getElementById('login-view').style.display = 'block';
      document.getElementById('dashboard-view').style.display = 'none';
      document.getElementById('header-user-actions').style.display = 'none';
    }

    function showDashboard() {
      document.getElementById('login-view').style.display = 'none';
      document.getElementById('dashboard-view').style.display = 'block';
      document.getElementById('header-user-actions').style.display = 'flex';
      loadStaff();
      loadLeads();
    }

    function switchTab(tabId, btn) {
      document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      document.getElementById('staff-tab').style.display = tabId === 'staff-tab' ? 'block' : 'none';
      document.getElementById('leads-tab').style.display = tabId === 'leads-tab' ? 'block' : 'none';
    }

    async function loadStaff() {
      try {
        const res = await fetch('/api/admin/staff');
        const data = await res.json();
        staffList = data.staff || [];
        renderStaffTable(staffList);
      } catch (err) {
        console.error('Failed to load staff:', err);
      }
    }

    function renderStaffTable(list) {
      const tbody = document.getElementById('staff-table-body');
      if (list.length === 0) {
        tbody.innerHTML = `<tr><td colspan="6" style="text-align: center; color: var(--text-muted); padding: 32px;">No staff cards found. Click "+ Add Staff" to create one.</td></tr>`;
        return;
      }

      tbody.innerHTML = list.map(s => {
        const initials = ((s.first_name || '')[0] || '') + ((s.last_name || '')[0] || '');
        const avatarHtml = s.avatar_path 
          ? `<img src="${s.avatar_path}" class="table-avatar" alt="${s.first_name}" />`
          : `<div class="table-initials">${initials.toUpperCase()}</div>`;

        const nfcUrl = `${window.location.origin}/p/${s.slug}?src=nfc`;
        const qrUrl = `/p/${s.slug}/qr.png`;

        return `
          <tr>
            <td>
              <div class="staff-cell">
                ${avatarHtml}
                <div class="staff-info">
                  <h4>${s.first_name} ${s.last_name}</h4>
                  <p>${s.job_title || 'No Title'} • ${s.department || 'General'}</p>
                </div>
              </div>
            </td>
            <td>
              <code style="background: rgba(255,255,255,0.06); padding: 3px 6px; border-radius: 4px;">/p/${s.slug}</code>
            </td>
            <td>
              <div style="font-size: 0.85rem;">${s.phone || '-'}</div>
              <div style="font-size: 0.78rem; color: var(--text-muted);">${s.email || '-'}</div>
            </td>
            <td>
              <span class="badge ${s.is_active ? 'badge-active' : 'badge-inactive'}">
                ${s.is_active ? 'Active' : 'Inactive'}
              </span>
            </td>
            <td>
              <div class="action-group">
                <a href="/p/${s.slug}?src=nfc" target="_blank" class="btn btn-secondary btn-sm" title="Preview live card">
                  👁️ View
                </a>
                <button class="btn btn-secondary btn-sm" onclick="copyNfcUrl('${nfcUrl}')" title="Copy URL for NFC Tools app">
                  ⚡ Copy NFC Link
                </button>
                <a href="${qrUrl}" download="qr_${s.slug}.png" class="btn btn-secondary btn-sm" title="Download print-ready QR">
                  📷 Print QR
                </a>
              </div>
            </td>
            <td>
              <div class="action-group">
                <button class="btn btn-secondary btn-sm" onclick="openEditModal('${s.id}')">✏️ Edit</button>
                <button class="btn btn-danger btn-sm" onclick="deleteStaff('${s.id}', '${s.first_name}')">🗑️</button>
              </div>
            </td>
          </tr>
        `;
      }).join('');
    }

    function filterStaff() {
      const q = document.getElementById('search-input').value.toLowerCase();
      const filtered = staffList.filter(s => 
        (s.first_name + ' ' + s.last_name).toLowerCase().includes(q) ||
        (s.job_title || '').toLowerCase().includes(q) ||
        (s.department || '').toLowerCase().includes(q) ||
        (s.slug || '').toLowerCase().includes(q)
      );
      renderStaffTable(filtered);
    }

    function copyNfcUrl(url) {
      navigator.clipboard.writeText(url);
      showToast('NFC URL copied to clipboard! Ready to paste into NFC Tools.');
    }

    async function loadLeads() {
      try {
        const res = await fetch('/api/admin/leads');
        const data = await res.json();
        const tbody = document.getElementById('leads-table-body');
        const leads = data.leads || [];

        if (leads.length === 0) {
          tbody.innerHTML = `<tr><td colspan="6" style="text-align: center; color: var(--text-muted); padding: 32px;">No leads collected yet. When recipients tap "Exchange Contact", leads will appear here.</td></tr>`;
          return;
        }

        tbody.innerHTML = leads.map(l => `
          <tr>
            <td><strong>${escapeHtml(l.visitor_name)}</strong></td>
            <td>${escapeHtml(l.visitor_contact)}</td>
            <td>${l.first_name ? `${l.first_name} ${l.last_name}` : 'Staff Member'}</td>
            <td><span class="badge ${l.source === 'nfc' ? 'badge-active' : 'badge-inactive'}">${(l.source || 'direct').toUpperCase()}</span></td>
            <td><small style="color: var(--text-muted);">${escapeHtml(l.visitor_note || '-')}</small></td>
            <td><small style="color: var(--text-muted);">${new Date(l.created_at).toLocaleDateString()}</small></td>
          </tr>
        `).join('');
      } catch (err) {
        console.error('Failed to load leads:', err);
      }
    }

    // Modal Operations
    function openCreateModal() {
      document.getElementById('modal-heading').textContent = 'Add New Staff Member';
      document.getElementById('staff-id').value = '';
      document.getElementById('staff-form').reset();
      document.getElementById('form-slug').readOnly = false;
      document.getElementById('avatar-preview-row').style.display = 'none';
      document.getElementById('staff-modal').style.display = 'flex';
    }

    function openEditModal(id) {
      const staff = staffList.find(s => s.id === id);
      if (!staff) return;

      document.getElementById('modal-heading').textContent = `Edit ${staff.first_name} ${staff.last_name}`;
      document.getElementById('staff-id').value = staff.id;
      document.getElementById('form-first-name').value = staff.first_name || '';
      document.getElementById('form-last-name').value = staff.last_name || '';
      document.getElementById('form-slug').value = staff.slug || '';
      document.getElementById('form-job-title').value = staff.job_title || '';
      document.getElementById('form-department').value = staff.department || '';
      document.getElementById('form-company').value = staff.company || 'Nevada Systems';
      document.getElementById('form-phone').value = staff.phone || '';
      document.getElementById('form-email').value = staff.email || '';
      document.getElementById('form-whatsapp').value = staff.whatsapp || '';
      document.getElementById('form-linkedin').value = staff.linkedin_url || '';
      document.getElementById('form-github').value = staff.github_url || '';
      document.getElementById('form-website').value = staff.website_url || '';
      document.getElementById('form-bio').value = staff.bio || '';
      document.getElementById('form-active').checked = !!staff.is_active;

      const previewRow = document.getElementById('avatar-preview-row');
      const previewImg = document.getElementById('avatar-preview-img');
      const removeCheck = document.getElementById('form-remove-avatar');
      removeCheck.checked = false;

      if (staff.avatar_path) {
        previewImg.src = staff.avatar_path;
        previewRow.style.display = 'flex';
      } else {
        previewRow.style.display = 'none';
      }

      document.getElementById('staff-modal').style.display = 'flex';
    }

    function closeStaffModal() {
      document.getElementById('staff-modal').style.display = 'none';
    }

    function autoGenerateSlug() {
      // Only auto-generate slug for new records
      if (document.getElementById('staff-id').value) return;
      const first = document.getElementById('form-first-name').value.trim();
      const last = document.getElementById('form-last-name').value.trim();
      const combined = `${first}-${last}`.toLowerCase().replace(/[^a-z0-9]/g, '-').replace(/-+/g, '-');
      document.getElementById('form-slug').value = combined.replace(/^-|-$/g, '');
    }

    function previewAvatar(e) {
      const file = e.target.files[0];
      if (file) {
        const previewRow = document.getElementById('avatar-preview-row');
        const previewImg = document.getElementById('avatar-preview-img');
        previewImg.src = URL.createObjectURL(file);
        previewRow.style.display = 'flex';
      }
    }

    async function handleStaffSubmit(e) {
      e.preventDefault();
      const id = document.getElementById('staff-id').value;
      const isEdit = !!id;

      const formData = new FormData();
      formData.append('first_name', document.getElementById('form-first-name').value);
      formData.append('last_name', document.getElementById('form-last-name').value);
      formData.append('slug', document.getElementById('form-slug').value);
      formData.append('job_title', document.getElementById('form-job-title').value);
      formData.append('department', document.getElementById('form-department').value);
      formData.append('company', document.getElementById('form-company').value);
      formData.append('phone', document.getElementById('form-phone').value);
      formData.append('email', document.getElementById('form-email').value);
      formData.append('whatsapp', document.getElementById('form-whatsapp').value);
      formData.append('linkedin_url', document.getElementById('form-linkedin').value);
      formData.append('github_url', document.getElementById('form-github').value);
      formData.append('website_url', document.getElementById('form-website').value);
      formData.append('bio', document.getElementById('form-bio').value);
      formData.append('is_active', document.getElementById('form-active').checked);

      const avatarFile = document.getElementById('form-avatar').files[0];
      if (avatarFile) {
        formData.append('avatar', avatarFile);
      }
      if (isEdit) {
        formData.append('remove_avatar', document.getElementById('form-remove-avatar').checked);
      }

      const url = isEdit ? `/api/admin/staff/${id}` : '/api/admin/staff';
      const method = isEdit ? 'PUT' : 'POST';

      try {
        const res = await fetch(url, { method, body: formData });
        const data = await res.json();
        if (data.success) {
          closeStaffModal();
          showToast(isEdit ? 'Staff member updated!' : 'New staff member added!');
          loadStaff();
        } else {
          alert(data.error || 'Failed to save staff member.');
        }
      } catch (err) {
        alert('Network error saving staff member.');
      }
    }

    async function deleteStaff(id, name) {
      if (!confirm(`Are you sure you want to delete ${name}'s digital card? This cannot be undone.`)) return;
      try {
        const res = await fetch(`/api/admin/staff/${id}`, { method: 'DELETE' });
        const data = await res.json();
        if (data.success) {
          showToast('Staff card deleted.');
          loadStaff();
        } else {
          alert(data.error || 'Failed to delete staff member.');
        }
      } catch (err) {
        alert('Network error deleting staff member.');
      }
    }

    function escapeHtml(str) {
      return String(str || '').replace(/[&<>'"]/g, tag => ({
        '&': '&amp;', '<': '&lt;', '>': '&gt;', "'": '&#39;', '"': '&quot;'
      }[tag] || tag));
    }
  </script>
</body>
</html>
